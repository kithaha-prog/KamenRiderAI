<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>假面骑士 Malaya RPG</title>
  <style>
    html,body{margin:0;height:100%;background:#08060c;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center}
    canvas{width:min(100vw,177.78vh);aspect-ratio:16/9;background:#000;display:block}
    canvas{width:min(100vw,177.78dvh)}
    html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
    #tc,#rot{display:none}
    body.touch #tc{display:block}
    #tc{position:fixed;inset:0;pointer-events:none;z-index:9;--s:clamp(46px,10.5vmin,80px)}
    #tc .b{position:absolute;pointer-events:auto;touch-action:none;width:var(--s);height:var(--s);border-radius:50%;
      display:flex;align-items:center;justify-content:center;text-align:center;font:700 calc(var(--s)*.26)/1.1 system-ui,sans-serif;color:#fff;
      background:rgba(20,26,44,.45);border:2px solid rgba(255,255,255,.5);box-shadow:0 0 8px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent}
    #tc .b.on,#tc #pad.on{background:rgba(255,255,255,.4)}
    #tc .sm{width:calc(var(--s)*.72);height:calc(var(--s)*.72);font-size:calc(var(--s)*.22)}
    #tc .atk{background:rgba(220,50,60,.5)}#tc .jmp{background:rgba(50,120,230,.5)}#tc .skl{background:rgba(230,150,30,.5)}#tc .trf{background:rgba(190,40,150,.5)}#tc .dg{background:rgba(0,190,200,.5)}
    #pad{position:absolute;pointer-events:auto;touch-action:none;left:2vmin;bottom:2.5vmin;width:calc(var(--s)*3.4);height:calc(var(--s)*1.3);
      border-radius:calc(var(--s)*.65);background:rgba(20,26,44,.4);border:2px solid rgba(255,255,255,.45);display:flex;justify-content:space-between;
      align-items:center;padding:0 calc(var(--s)*.35);box-sizing:border-box;font-size:calc(var(--s)*.5);color:#fff}
    #pad i{font-style:normal;opacity:.4;transition:.05s}#pad i.on{opacity:1}
    #rot{position:fixed;inset:0;z-index:20;background:#08060c;color:#fff;align-items:center;justify-content:center;font:700 20px system-ui;text-align:center;padding:20px}
    @media (orientation:portrait){body.touch #rot{display:flex}}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="rot">📱 请将设备横屏游玩<br>（并可「添加到主屏幕」全屏运行）</div>

  <!-- 按依赖层级由浅入深依次引入 -->
  <script src="js/config.js"></script>
  <script src="js/equipment.js"></script>
  <script src="js/player.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
