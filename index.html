<script>
const TOUCH=/[?&]touch=1/.test(location.search)||(matchMedia('(pointer:coarse)').matches&&navigator.maxTouchPoints>0);

// ===== 配置：素材路径 =====

 wd:{hp:90,H:140,sp:70,xp:30,g:20,dm:10,col:'#c9a0ff'},

const ST=[
 {n:'1-1 公路入口',k:10,b:0,wd:0,hm:1,dm:1,g:150,r:1,ov:'',set:1},

 {n:'1-3 翡翠巨龙',k:14,b:1,bn:'翡翠巨龙',wd:.4,hm:2.2,dm:1.7,g:700,r:8,ov:'rgba(20,0,70,.32)',set:1},
 {n:'2-1 熔岩边境',k:14,b:0,wd:.3,hm:2.8,dm:2.0,g:950,r:11,ov:'rgba(255,60,0,.16)',set:2},
 {n:'2-2 烈焰焦土',k:18,b:0,wd:.5,hm:3.6,dm:2.4,g:1400,r:15,ov:'rgba(220,40,0,.26)',set:2},
 {n:'2-3 炎狱魔尊',k:16,b:1,bn:'炎狱魔尊',wd:.5,hm:4.8,dm:3.0,g:2500,r:20,ov:'rgba(90,0,10,.38)',set:2}];

// ===== 素材切片与连通域杂质剔除工具 =====
const load=s=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(s);i.src=encodeURI(s)});

function key(im,x,y,w,h){
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,x,y,w,h,0,0,w,h);
 const d=g.getImageData(0,0,w,h),p=d.data;
 for(let i=0;i<p.length;i+=4){
  const r=p[i],gg=p[i+1],b=p[i+2],k=gg-Math.max(r,b);
  if(gg>80&&k>45){
   if(k>80)p[i+3]=0;
   else p[i+3]=Math.max(0,255*(80-k)/35);
  }
 }
 g.putImageData(d,0,0);return c;
}

// 连通分量分析：剔除边界串入的残肢断脚与噪点孤岛
function cleanFrame(canvas, minRatio=0.06){
 const w=canvas.width,h=canvas.height,ctx=canvas.getContext('2d');
 const imgData=ctx.getImageData(0,0,w,h),p=imgData.data;
 const vis=new Uint8Array(w*h),blobs=[];

 for(let y=0;y<h;y++){
  for(let x=0;x<w;x++){
   const idx=y*w+x;
   if(vis[idx]||p[idx*4+3]<=25)continue;
   const q=[idx],pxs=[];vis[idx]=1;
   let minX=x,maxX=x,minY=y,maxY=y,head=0;
   while(head<q.length){
    const cur=q[head++],cx=cur%w,cy=(cur/w)|0;
    pxs.push(cur);
    if(cx<minX)minX=cx;if(cx>maxX)maxX=cx;
    if(cy<minY)minY=cy;if(cy>maxY)maxY=cy;
    const nbs=[cx>0?cur-1:-1,cx<w-1?cur+1:-1,cur-w,cur+w];
    for(const n of nbs){
     if(n>=0&&n<w*h&&!vis[n]&&p[n*4+3]>25){vis[n]=1;q.push(n)}
    }
   }
   blobs.push({pxs,cnt:pxs.length,minX,maxX,minY,maxY});
  }
 }
 if(blobs.length<=1)return canvas;
 blobs.sort((a,b)=>b.cnt-a.cnt);
 const main=blobs[0],thr=main.cnt*minRatio;
 const mainCenterX=(main.minX+main.maxX)/2;

 for(let i=1;i<blobs.length;i++){
  const b=blobs[i];
  const touchesEdge=(b.minX<=3||b.maxX>=w-4||b.minY<=3||b.maxY>=h-4);
  const isFar=Math.abs((b.minX+b.maxX)/2-mainCenterX)>w*0.25;
  if(b.cnt<thr||(touchesEdge&&isFar)){
   for(const pt of b.pxs)p[pt*4+3]=0;
  }
 }
 ctx.putImageData(imgData,0,0);
 return canvas;
}

function bb(c){
 const w=c.width,h=c.height,p=c.getContext('2d').getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(p[(y*w+x)*4+3]>128){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 return{x0,y0,x1,y1};
}

function trim(c){const b=bb(c),w=b.x1-b.x0+1,h=b.y1-b.y0+1,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,b.x0,b.y0,w,h,0,0,w,h);return o}

function sliceSheet(im,cNum,rNum,refIdx=0,cut=0,doClean=false){
 const cw=im.width/cNum|0,ch=im.height/rNum|0,fr=[];
 for(let r=0;r<rNum;r++)for(let c=0;c<cNum;c++){
  let k=key(im,c*cw,r*ch,cw,ch);
  if(cut&&r===rNum-1)k.getContext('2d').clearRect(0,ch-cut,cw,cut);
  if(doClean)k=cleanFrame(k);
  fr.push(k);
 }
 const b=bb(fr[refIdx]||fr[0]);
 return {f:fr,cw,ch,fy:b.y1,s:PH/(b.y1-b.y0)};
}
function ph(c){const o=document.createElement('canvas');o.width=80;o.height=120;const g=o.getContext('2d');g.fillStyle=c;g.fillRect(10,10,60,110);return o}

async function prep(){
 msg='加载场景…';SC=await load(SCN);
 
 // 1. 加载原生 Malaya 动作（基准尺寸）
 for(const o of Object.values(SH)){
  msg='加载骑士技能…';const im=await load(KR+o.f);
  Object.assign(o,sliceSheet(im,o.c,o.r,o.ref,o.cut||0));
  if(o.mid)o.fy=o.ch/2;if(o.w){const b=bb(o.f[o.ref]);o.s=o.w/(b.x1-b.x0)}
 }

 // 2. 加载扭蛋结算大图
 try{CAP_IMG=await load(DRAW+'KR_Ryuki.jpg')}catch(e){miss.push('Draw/KR_Ryuki.jpg')}

 // 3. 加载变身动画（以第0帧 Malaya 原形为基准锚点，做到1:1绝对等比）
 // 1. 加载变身动画
  try {
    let trIm;
    try { trIm = await load(TRANS + 'KR_Malaya_TrasnformTo_KR_Ryuki.jpg'); }
    catch(e) { trIm = await load(TRANS + 'KR_Malaya_TransformTo_KR_Ryuki.jpg'); }
    // 以第0帧(Malaya)为标准基准
    SH.ryukiTrans = sliceSheet(trIm, 4, 4, 0, 0, true);
  } catch(e) { miss.push('Transform/KR_Malaya_TrasnformTo_KR_Ryuki.jpg'); }

  // 2. 加载龙骑专属动作模组（Run 与 NormalAttack）
  for (const [key, o] of Object.entries(SHR)) {
    try {
      const im = await load(RYUKI + o.f);
      Object.assign(o, sliceSheet(im, o.c || 4, o.r || 2, o.ref || 0, o.cut || 0, true));
      if (key === 'sword') {
        // 飞剑:按宽度 w 缩放,居中绘制(与 Malaya 飞剑一致)
        const b = bb(o.f[o.ref]);
        if (o.w) o.s = o.w / (b.x1 - b.x0);
      } else if (key !== 'jump' && SH.atk && SH.atk.s) {
        // run / atk 与 Malaya 攻击图 1:1 对齐;jump 用自己站立帧(ref:8)归一化,和 Malaya 的做法一致
        o.s = SH.atk.s;
      }
    } catch(e) {
      miss.push('Kamen Rider Ryuki/' + o.f);
    }
  }

 for(let n=1;n<=2;n++){
  try{const im=await load(ED+'Enemies_'+n+'.jpg');const sp=cut(im);ENL.push(...sp);ENS[n]=assign(sp)}
  catch(e){miss.push('Enemies_'+n+'.jpg');ENS[n]={imp:[ph(ET.imp.col)],wd:[ph(ET.wd.col)],boss:[ph(ET.boss.col)]}}
 }
 const R=assign(ENL);for(const k in ET)EN[k]=R[k]&&R[k].length?R[k]:ENL.length?ENL:[ph(ET[k].col)];
 const li=async f=>{try{return await load(f)}catch(e){miss.push(f.split('/').pop())}};
 IM.v=await li(A+'Interior/基地.jpg');
 for(const b of BD){b.ri=await li(A+'Interior/'+b.rf);const im=await li(A+'Buildings/'+b.bf);if(im)b.bi=bkey(im)}
 const bi=await load(KR+'KR_Malaya_Vehicles.jpg');BK=trim(key(bi,0,0,bi.width,bi.height));G='title';
}
prep().catch(e=>{G='err';msg='加载出现问题，请确保使用本地服务器(http://)并放置素材。'});

// ===== 绘图工具 =====
function rpath(x,y,w,h,r=8){
 ctx.beginPath();
 if(ctx.roundRect){ctx.roundRect(x,y,w,h,r)}
 else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
}
function dr(S,i,x,y,fl=1,sx=1,al=1,mid=0){ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.scale(fl*S.s*sx,S.s*sx);ctx.drawImage(S.f[i],-S.cw/2,mid?-S.ch/2:-S.fy);ctx.restore()}
function txt(s,x,y,sz=16,c='#fff',al='left',stk=true){
 ctx.font=`700 ${sz}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif`;
 ctx.textAlign=al;ctx.textBaseline='middle';
 const ls=String(s).split('\n'),lh=sz*1.32;
 ls.forEach((l,i)=>{
  const py=y+i*lh;
  if(stk){ctx.lineWidth=Math.max(2,sz*0.16);ctx.strokeStyle='rgba(4,6,12,0.92)';ctx.strokeText(l,x,py)}
  ctx.fillStyle=c;ctx.fillText(l,x,py);
 });
}
function bar(x,y,w,h,v,m,c1,c2=null,r=5){
 rpath(x-1.5,y-1.5,w+3,h+3,r+1);ctx.fillStyle='rgba(6,10,18,0.85)';ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.stroke();
 const fillW=Math.max(0,w*cl(v/m,0,1));
 if(fillW>0){
  rpath(x,y,fillW,h,r);
  if(c2){const g=ctx.createLinearGradient(x,y,x+w,y);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g}
  else ctx.fillStyle=c1;
  ctx.fill();
 }
}
function bg(){
 if(!SC){ctx.fillStyle='#0b0812';ctx.fillRect(0,0,960,540);return}
 const w=SC.width*540/SC.height,k=Math.floor(cam/w);
 for(let i=k;i*w-cam<960;i++){
  ctx.save();const x=i*w-cam;if(i&1){ctx.translate(x+w,0);ctx.scale(-1,1)}else ctx.translate(x,0);
  ctx.drawImage(SC,0,0,w+1,540);ctx.restore();
 }
 const v=(G==='play'||G==='over'||G==='win')?ST[cur].ov:'';
 if(v){ctx.fillStyle=v;ctx.fillRect(0,0,960,540)}
}

// ===== 基地村庄与互动建筑 =====
const VW=2200,ENL=[],EMAP=null;
const BD=[
 {x:800,n:'药铺',pg:'shop',bf:'药铺.jpg',rf:'药房背景.jpg',npc:'药师 阿玲',hi:'欢迎光临！药水随时补货。',c:'#3fae72',nc:'#7dffb0'},
 {x:1150,n:'铁匠铺',pg:'eq',bf:'铁匠铺.jpg',rf:'铁匠铺背景.jpg',npc:'铁匠 老岩',hi:'装备与变身胶囊都在这里整备。',c:'#c0703a',nc:'#ffb070'},
 {x:1460,n:'训练馆',pg:'tal',bf:'训练馆.jpg',rf:'训练馆背景.jpg',npc:'教官 无相',hi:'升级得来的天赋点，在这里点。',c:'#6a5acd',nc:'#b8a8ff'},
 {x:1720,n:'扭蛋机',pg:'gacha',bf:'扭蛋机.jpg',rf:'',npc:'扭蛋终端',hi:'放入金币，抽取假面骑士龙骑变身胶囊！',c:'#e84118',nc:'#ff7675'}
];
const EL={x:500,npc:'长老 阿公'},PT=1950,PG={npc:'传送门',hi:'选择要挑战的关卡',nc:'#7df',pg:'st'},IM={},RMN=640;
let M=0,RM=BD[0],NR=null;
const RW=()=>RM.ri?Math.max(960,RM.ri.width*540/RM.ri.height|0):960;

function bkey(im){
 const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,0,0);
 const d=g.getImageData(0,0,w,h),p=d.data,sd=[[0,0],[w-1,0],[w>>1,0],[0,h>>1],[w-1,h>>1],[0,h-1],[w-1,h-1],[w>>1,h-1],[0,h*.9|0],[w-1,h*.9|0]].map(([x,y])=>{const i=(y*w+x)*4;return[p[i],p[i+1],p[i+2]]});
 const seen=new Uint8Array(w*h),st=[],push=(x,y)=>{const n=y*w+x,i=n*4;if(!seen[n]&&sd.some(s=>Math.abs(p[i]-s[0])+Math.abs(p[i+1]-s[1])+Math.abs(p[i+2]-s[2])<45)){seen[n]=1;st.push(n)}};
 for(let x=0;x<w;x++){push(x,0);push(x,h-1)}for(let y=0;y<h;y++){push(0,y);push(w-1,y)}
 while(st.length){const n=st.pop(),x=n%w,y=n/w|0;p[n*4+3]=0;if(x>0)push(x-1,y);if(x<w-1)push(x+1,y);if(y>0)push(x,y-1);if(y<h-1)push(x,y+1)}
 g.putImageData(d,0,0);const cx=new Int32Array(w),cy=new Int32Array(h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(p[(y*w+x)*4+3]){cx[x]++;cy[y]++}
 const f=(a,n)=>{let i=0,j=n-1;while(i<n&&a[i]<12)i++;while(j>0&&a[j]<12)j--;return[i,j]},[x0,x1]=f(cx,w),[y0,y1]=f(cy,h),o=document.createElement('canvas');
 o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o;
}

function cut(im){
 const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,0,0);
 const d=g.getImageData(0,0,w,h),p=d.data,cs=[0,(w-1)*4,(h-1)*w*4,(h*w-1)*4],bc=[0,1,2].map(j=>cs.map(i=>p[i+j]).sort((a,b)=>a-b)[1]);
 const seen=new Uint8Array(w*h),st=[],push=(x,y)=>{const n=y*w+x,i=n*4;if(!seen[n]&&Math.abs(p[i]-bc[0])+Math.abs(p[i+1]-bc[1])+Math.abs(p[i+2]-bc[2])<110){seen[n]=1;st.push(n)}};
 for(let x=0;x<w;x++){push(x,0);push(x,h-1)}for(let y=0;y<h;y++){push(0,y);push(w-1,y)}
 while(st.length){const n=st.pop(),x=n%w,y=n/w|0;p[n*4+3]=0;if(x>0)push(x-1,y);if(x<w-1)push(x+1,y);if(y>0)push(x,y-1);if(y<h-1)push(x,y+1)}
 g.putImageData(d,0,0);const gw=Math.ceil(w/4),gh=Math.ceil(h/4),m=new Uint8Array(gw*gh),D=new Uint8Array(gw*gw);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(p[(y*w+x)*4+3])m[(y>>2)*gw+(x>>2)]=1;
 for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)if(m[y*gw+x])for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){const X=x+i,Y=y+j;if(X>=0&&X<gw&&Y>=0&&Y<gh)D[Y*gw+X]=1}
 const out=[];
 for(let s0=0;s0<D.length;s0++){if(D[s0]!==1)continue;let x0=gw,y0=gh,x1=0,y1=0,cnt=0;const q=[s0];D[s0]=2;
  while(q.length){const n=q.pop(),x=n%gw,y=n/gw|0;cnt+=m[n];x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
   for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+a,Y=y+b;if(X>=0&&X<gw&&Y>=0&&Y<gh&&D[Y*gw+X]===1){D[Y*gw+X]=2;q.push(Y*gw+X)}}}
  if(cnt<gw*gh*.0015)continue;const o=document.createElement('canvas'),ow=(x1-x0+1)*4,oh=(y1-y0+1)*4;o.width=ow;o.height=oh;
  o.getContext('2d').drawImage(c,x0*4,y0*4,ow,oh,0,0,ow,oh);const t=trim(o);t.ry=Math.round((y0+y1)/2/(gh/6));t.rx=x0;out.push(t)}
 return out.sort((a,b)=>a.ry-b.ry||a.rx-b.rx);
}

}

 DT.push({x:e.x,y:e.y-e.h,s:d+(c?'!':''),t:.8,c:c?'#ff8a2a':'#ffd84a'});
 FX.push({x:e.x,y:e.y-e.h/2,i:11,t:.25,d:.25,sx:.5+Math.random()*.2});shake=Math.max(shake,4);
 if(e.hp<=0&&!e.dead){e.dead=1;kills++;gain(ET[e.t].xp*(1+cur*.4));RG+=ET[e.t].g*(1+cur*.3)|0;if(Math.random()<.35)OR.push({x:e.x,k:Math.random()<.5?'h':'m'});if(e.t==='boss')fin(1);FX.push({x:e.x,y:e.y-e.h/2,i:12,t:.5,d:.5,sx:e.t==='boss'?3:1.2})}

// ===== 角色与变身动作绘制（严格等比） =====
function drawP() {
  const x = P.x - cam, y = P.y, f = P.f;
  if (P.inv > 0 && (T * 20 | 0) % 2 && P.st !== 'fv' && P.st !== 'dash' && P.st !== 'trans_ryuki') return;

  // 1. 变身过渡动画（1:1严格匹配）
  if (P.st === 'trans_ryuki' && SH.ryukiTrans) {
    const frame = Math.min(15, Math.floor(P.t / 0.12));
    ctx.save();
    if (frame >= 8 && frame <= 13) { ctx.shadowColor = '#ff3838'; ctx.shadowBlur = 28; }
    dr(SH.ryukiTrans, frame, x, y, f, 1.0);
    ctx.restore();
    return;
  }

  // 机车冲刺
  if (P.st === 'dash') {
    const s = 230 / BK.width;
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = 'rgba(255,210,90,' + (.5 - i * .1) + ')';
      ctx.fillRect(x - f * (120 + i * 40) - 20, y - 40 - i * 12, 40, 4);
    }
    ctx.save(); ctx.translate(x, y); ctx.scale(f * s, s);
    ctx.drawImage(BK, -BK.width / 2, -BK.height);
    ctx.restore(); return;
  }

  // 2. 龙骑变身形态：独立专属动作分支
  if (P.ryuki) {
    ctx.save();
    ctx.shadowColor = '#ff4757';
    ctx.shadowBlur = 12 + Math.sin(T * 6) * 5; // 赤龙斗气

    if (P.st === 'run') {
      // 龙骑专属奔跑模组 (KR_Ryuki_Run.jpg)
      if (SHR.run && SHR.run.f && SHR.run.f.length) {
        const runIdx = (T * 12 | 0) % SHR.run.f.length;
        dr(SHR.run, runIdx, x, y, f, 1.0);
      } else {
        dr(SH.run, (T * 14 | 0) % 12, x, y, f, 1.0);
      }
    } else if (P.st === 'atk') {
      // 龙骑专属攻击模组 (KR_Ryuki_NormalAttack.jpg)
      if (SHR.atk && SHR.atk.f && SHR.atk.f.length) {
        const total = SHR.atk.f.length;
        const atkIdx = Math.min(total - 1, (P.t * 16 | 0) % total);
        dr(SHR.atk, atkIdx, x, y, f, 1.0);
      } else {
        const i = [3, 4, 5, 6, 7, 8][Math.min(5, P.t * 14 | 0)];
        dr(SH.atk, i, x, y, f, 1.0);
      }
    } else if (P.st === 'idle' && P.land > 0 && SHR.jump && SHR.jump.f && SHR.jump.f.length) {
      dr(SHR.jump, 7, x, y, f, 1.0); // 落地烟尘
    } else if (P.st === 'idle' || P.st === 'trans') {
      // 保持最后一帧：变身序列第15帧待机
      if (SH.ryukiTrans && SH.ryukiTrans.f[15]) {
        const breath = Math.sin(T * 3) * 1.2;
        dr(SH.ryukiTrans, 15, x, y + breath, f, 1.0);
      } else {
        dr(SH.atk, 12, x, y, f, 1.0);
      }
    } else if (P.st === 'air') {
      if (SHR.jump && SHR.jump.f && SHR.jump.f.length) {
        const i = P.vy < -350 ? 2 : P.vy < -100 ? 3 : P.vy < 100 ? 4 : P.vy < 250 ? 5 : 6; // 龙骑跳跃图:2起跳 3上升 4/5顶点火焰踢 6下落
        dr(SHR.jump, i, x, y, f, 1.0);
      } else if (SHR.run && SHR.run.f[1]) {
        dr(SHR.run, 1, x, y - 5, f, 1.0);
      } else {
        dr(SH.jump, 2, x, y, f, 1.0);
      }
    } else if (P.st === 'thr' && SHR.atk && SHR.atk.f) {
    dr(SHR.atk, P.t < .12 ? 3 : 4, x, y, f, 1.0);
    // 原来的 Final Vent 等
    } else {
      // 其他技能 (Final Vent、飞剑等)
      let S = SH.atk, i = 12;
      if (P.st === 'thr') i = P.t < .12 ? 3 : 4;
      else if (P.st === 'fv') { S = SH.fv; i = P.t < .99 ? (P.t / .11 | 0) + 1 : (P.t < 1.3 ? 12 : 14); }
      dr(S, i, x, y, f, 1.0);
    }

    ctx.restore();
    return;
  }

  // 3. 原生 Malaya 动作渲染
  let S, i, lift = 0;
  switch (P.st) {
    case 'trans': S = SH.trans; i = Math.min(15, P.t * 7 | 0); break;
    case 'run': S = SH.run; i = (T * 14 | 0) % 12; break;
    case 'air': S = SH.jump; i = P.vy < -250 ? 2 : P.vy < 0 ? 4 : P.vy < 250 ? 6 : 5; break;
    case 'atk': S = SH.atk; i = [3, 4, 5, 6, 7, 8][Math.min(5, P.t * 14 | 0)]; break;
    case 'thr': S = SH.atk; i = P.t < .12 ? 3 : 4; break;
    case 'fv': S = SH.fv; if (P.t < .99) { const k = P.t / .11 | 0; i = k + 1; if (k >= 4) lift = 50; } else i = P.t < 1.3 ? 12 : P.t < 1.4 ? 13 : 14; break;
    default: if (P.land > 0) { S = SH.jump; i = 9; } else { S = SH.atk; i = 12 + (T * 2 | 0) % 2; }
  }
  dr(S, i, x, y - lift, f);
}

// ===== 触屏控制层（把触摸转换成键盘事件，游戏逻辑无需改动）=====
(function(){
 if(!TOUCH)return;
 // 提示文字替换成触屏说法
 const MAP=[['按 Enter 进入基地','点击屏幕进入基地'],['按 Enter 回村','点击屏幕回村'],['确定 [Enter / 空格]','点击任意处确定'],
  ['[F] ','[✔] '],['W/S 选择    Enter/F 确认    Esc 关闭','点条目选择 · 再点一次确认 · 点面板外关闭'],['[C / ESC] 关闭','点击任意处关闭'],
  ['[1]×','①×'],['[2]×','②×'],['按P变身','点「变身」键'],['按 P 变身','点「变身」键'],['[P] ','「变身」'],['点击回车装备','点击装备']];
 const _txt=txt;
 txt=function(s,...a){s=String(s);
  if(s.startsWith('A/D 移动')||s.startsWith('J 剑击'))s='';
  else for(const[m,r]of MAP)if(s.includes(m))s=s.split(m).join(r);
  return _txt(s,...a)};
 const press=c=>{if(!K[c])PR[c]=1;K[c]=1},rel=c=>{K[c]=0};
 let lastEsc=0;
 const B=[ // [文字, class, 位置样式, 键码, 特殊]
  ['剑击','atk','right:calc(var(--s)*.2 + 1.5vmin);bottom:calc(var(--s)*.2 + 2vmin);width:calc(var(--s)*1.4);height:calc(var(--s)*1.4);font-size:calc(var(--s)*.34)',['KeyJ']],
  ['跳','jmp','right:calc(var(--s)*1.85 + 1.5vmin);bottom:calc(var(--s)*.15 + 2vmin)',['Space']],
  ['终结技','skl','right:calc(var(--s)*.25 + 1.5vmin);bottom:calc(var(--s)*1.75 + 2vmin)',['KeyK']],
  ['飞剑','skl','right:calc(var(--s)*1.75 + 1.5vmin);bottom:calc(var(--s)*1.3 + 2vmin)',['KeyL']],
  ['机车','skl','right:calc(var(--s)*3.3 + 1.5vmin);bottom:calc(var(--s)*.6 + 2vmin)',['KeyE']],
  ['变身','trf sm','left:calc(2vmin + var(--s)*.1);bottom:calc(var(--s)*1.5 + 3vmin)',['KeyP']],
  ['药①','sm','left:calc(2vmin + var(--s)*.95);bottom:calc(var(--s)*1.5 + 3vmin)',['Digit1']],
  ['药②','sm','left:calc(2vmin + var(--s)*1.8);bottom:calc(var(--s)*1.5 + 3vmin)',['Digit2']],
  ['▲','sm','left:calc(50% - var(--s)*1.55);bottom:2vmin',['KeyW']],
  ['✔<br>互动','sm','left:calc(50% - var(--s)*.36);bottom:2vmin;width:var(--s);height:var(--s);font-size:calc(var(--s)*.24)',['KeyF','Enter']],
  ['▼','sm','left:calc(50% + var(--s)*.83);bottom:2vmin',['KeyS']],
  ['规格','sm','left:calc(50% - var(--s)*1.2);top:1vmin;opacity:.75',['KeyC']],
  ['关闭<br>撤退','sm','left:calc(50% + var(--s)*.48);top:1vmin;opacity:.75',['Escape'],1],
 ];
 const ui=document.createElement('div');ui.id='tc';
 const pad=document.createElement('div');pad.id='pad';pad.innerHTML='<i>◀</i><i>▶</i>';ui.appendChild(pad);
 for(const[t,c,pos,codes,esc]of B){
  const b=document.createElement('div');b.className='b '+c;b.style.cssText=pos;b.innerHTML=t;ui.appendChild(b);
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');
   if(esc&&G==='play'&&!showChar&&Date.now()-lastEsc>1500){lastEsc=Date.now();DT.push({x:P.x,y:P.y-180,s:'再点一次撤退',t:1.2,c:'#ffd84a'});return}
   codes.forEach(press)});
  const up=()=>{b.classList.remove('on');codes.forEach(rel)};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
 }
 if(document.documentElement.requestFullscreen){
  const f=document.createElement('div');f.className='b sm';f.textContent='⛶';f.style.cssText='left:calc(50% + var(--s)*1.25);top:1vmin;opacity:.75';
  f.addEventListener('pointerdown',e=>{e.preventDefault();document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})});
  ui.appendChild(f);
 }
 document.body.appendChild(ui);
 // 方向盘：左右滑动
 const arrows=pad.querySelectorAll('i');
 const setDir=e=>{const r=pad.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,l=x<.45,rt=x>.55;
  l?press('KeyA'):rel('KeyA');rt?press('KeyD'):rel('KeyD');arrows[0].classList.toggle('on',l);arrows[1].classList.toggle('on',rt);pad.classList.toggle('on',l||rt)};
 const stop=()=>{rel('KeyA');rel('KeyD');arrows.forEach(a=>a.classList.remove('on'));pad.classList.remove('on')};
 pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);setDir(e)});
 pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))setDir(e)});
 pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);
 // 点击画面：标题/结算/弹窗确认，商店点选条目
 cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*960,y=(e.clientY-r.top)/r.height*540;
  if(gachaModal)return PR.Enter=1;
  if(showChar)return PR.Escape=1;
  if(G==='title'||G==='over'||G==='win'||(G==='play'&&P.st==='trans'))return PR.Enter=1;
  if((G==='vil'||G==='room')&&M){
   if(x<180||x>780||y<30||y>510)return PR.Escape=1;
   const n=items().length,lw=V.pg==='eq'?320:540,k=Math.round((y-168)/44);
   if(x>=210&&x<=210+lw&&k>=0&&k<n&&Math.abs(y-168-k*44)<=22){if(k===V.i)PR.Enter=1;else V.i=k}
  }
 });
 // 失焦时松开所有按键；禁用长按菜单
 const relAll=()=>{for(const k in K)K[k]=0};
 addEventListener('blur',relAll);document.addEventListener('visibilitychange',relAll);
 addEventListener('contextmenu',e=>e.preventDefault());
 document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
})();
